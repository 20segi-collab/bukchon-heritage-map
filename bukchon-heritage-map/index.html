        },

          zh: '[商业化提示] 租售非传统剪裁的亮片化纤服装及快照图廊，缺乏韩国传统服饰考据与历史文化内涵。'
        },
        docentAudioScript: {

          en: 'Note: This spot is a tourist commercial studio renting synthetic shiny costumes rather than historic Korean Hanbok textiles.',
          ja: 'ご注意：この場所は伝統文化の保存空間ではなく、観光用の撮影スタジオです。',

        positiveTags: ['#사진촬영'],
        commercialWarningTags: ['#공장형체험', '#단순포토존', '#퓨전변형의상', '#과도한상업화', '#역사고증부재'],
        reviewsCount: 310,
        reviews: [
          {
            id: 'r6',
            user: 'Tourist Feedback Team',
            date: '2026-08-10',
            authenticityRating: 1.8,
            culturalValueRating: 2.0,
            commercialityRating: 4.8,
            comment: 'Cheap polyester clothes with glued-on glitter. Not real Korean culture at all.',
            tags: ['#TouristTrap', '#SyntheticFabric'],

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      const [language, setLanguage] = useState('ko');
      const [viewMode, setViewMode] = useState('map');
      const [places, setPlaces] = useState(INITIAL_HERITAGE_PLACES);
      const [selectedPlace, setSelectedPlace] = useState(INITIAL_HERITAGE_PLACES[0]);
      
      const [filters, setFilters] = useState({
        category: 'all',
        mustSeeOnly: false,
        minAuthenticityScore: 1.0,
        searchQuery: ''
      });

      const [reviewingPlace, setReviewingPlace] = useState(null);
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [audioProgress, setAudioProgress] = useState(0);

      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef({});

      const t = TRANSLATIONS[language];

      // Audio simulator timer
      useEffect(() => {
        let interval;
        if (isPlayingAudio) {
          interval = setInterval(() => {
            setAudioProgress((prev) => {
              if (prev >= 100) {
                setIsPlayingAudio(false);
                return 0;
              }
              return prev + 2;
            });
          }, 200);
        } else {
          setAudioProgress(0);
        }
        return () => clearInterval(interval);
      }, [isPlayingAudio]);

      useEffect(() => {
        setIsPlayingAudio(false);
        setAudioProgress(0);
      }, [selectedPlace?.id]);

      // Filtered Places
      const filteredPlaces = useMemo(() => {
        return places.filter((place) => {
          if (filters.category !== 'all' && place.category !== filters.category) return false;
          if (filters.mustSeeOnly && place.grade !== 'must-see' && place.grade !== 'high') return false;
          if (place.authenticityScore < filters.minAuthenticityScore) return false;

          if (filters.searchQuery.trim()) {
            const q = filters.searchQuery.toLowerCase();
            const nameMatch = Object.values(place.name).some(n => n.toLowerCase().includes(q));
            const tagMatch = place.positiveTags.some(t => t.toLowerCase().includes(q));
            if (!nameMatch && !tagMatch) return false;
          }
          return true;
        });
      }, [places, filters]);

      // Map Setup
      useEffect(() => {
        if (viewMode !== 'map' || !mapContainerRef.current) return;

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [37.5805, 126.9855],
            zoom: 15,
            zoomControl: false
          });

          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
          }).addTo(map);

          L.control.zoom({ position: 'topright' }).addTo(map);
          mapInstanceRef.current = map;
        }
      }, [viewMode]);

      // Update Leaflet Markers
      useEffect(() => {
        if (viewMode !== 'map' || !mapInstanceRef.current) return;
        const map = mapInstanceRef.current;

        Object.values(markersRef.current).forEach((m) => m.remove());
        markersRef.current = {};

        filteredPlaces.forEach((place) => {
          const isMustSee = place.grade === 'must-see' || place.grade === 'high';
          const isSelected = selectedPlace?.id === place.id;

          let markerHtml = '';
          if (isMustSee) {
            markerHtml = `
              <div class="relative group cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white shadow-lg ring-2 ring-amber-200 transform transition-all duration-300 ${
                  isSelected ? 'scale-125 ring-4 ring-amber-400 z-50' : ''
                }">
                  <span class="font-serif font-bold text-sm">韓</span>
                </div>
                <div class="absolute -top-2 -right-1 bg-amber-400 text-slate-950 font-extrabold text-[9px] px-1 rounded-full shadow border border-amber-200">
                  ${place.authenticityScore.toFixed(1)}⭐
                </div>
                <div class="w-2 h-2 bg-amber-600 rotate-45 mx-auto -mt-1 shadow-md"></div>
              </div>
            `;
          } else {
            markerHtml = `
              <div class="relative group cursor-pointer opacity-80">
                <div class="w-8 h-8 rounded-full bg-slate-600 flex items-center justify-center text-slate-200 shadow-md border border-slate-400 ${
                  isSelected ? 'scale-125 bg-rose-600 text-white z-50' : ''
                }">
                  <span class="font-sans font-bold text-[10px]">상업</span>
                </div>
                <div class="w-1.5 h-1.5 bg-slate-600 rotate-45 mx-auto -mt-0.5"></div>
              </div>
            `;
          }

          const customIcon = L.divIcon({
            html: markerHtml,
            className: 'custom-heritage-marker',
            iconSize: [40, 44],
            iconAnchor: [20, 44]
          });

          const marker = L.marker([place.lat, place.lng], { icon: customIcon }).addTo(map);

          marker.on('click', () => {
            setSelectedPlace(place);
            map.panTo([place.lat, place.lng], { animate: true });
          });

          markersRef.current[place.id] = marker;
        });
      }, [filteredPlaces, selectedPlace, viewMode]);

      const handleReviewSubmit = (placeId, newReview) => {
        setPlaces((prev) =>
          prev.map((p) => {
            if (p.id !== placeId) return p;
            const updatedRev = [newReview, ...p.reviews];
            return {
              ...p,
              reviewsCount: updatedRev.length,
              reviews: updatedRev
            };
          })
        );
        if (selectedPlace?.id === placeId) {
          setSelectedPlace((prev) => prev ? { ...prev, reviews: [newReview, ...prev.reviews] } : null);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-heritage-paper">
          
          {/* Header Navbar */}
          <header className="bg-heritage-navy text-white shadow-lg sticky top-0 z-40 border-b border-amber-600/30 px-4 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-amber-500 to-amber-600 flex items-center justify-center shadow-lg font-serif font-bold text-white text-xl">
                  韓
                </div>
                <div>
                  <h1 className="font-serif font-bold text-base sm:text-lg text-amber-100">
                    {t.appTitle}
                  </h1>
                  <p className="text-[11px] text-slate-300 hidden sm:block">
                    {t.appSubtitle}
                  </p>
                </div>
              </div>

              {/* Controls */}
              <div className="flex items-center space-x-3">
                
                {/* Map/List Switch */}
                <div className="bg-slate-800 p-1 rounded-lg flex border border-slate-700 text-xs">
                  <button
                    onClick={() => setViewMode('map')}
                    className={`px-3 py-1 rounded font-medium ${viewMode === 'map' ? 'bg-amber-600 text-white font-bold' : 'text-slate-300'}`}
                  >
                    Map
                  </button>
                  <button
                    onClick={() => setViewMode('list')}
                    className={`px-3 py-1 rounded font-medium ${viewMode === 'list' ? 'bg-amber-600 text-white font-bold' : 'text-slate-300'}`}
                  >
                    List
                  </button>
                </div>

                {/* Language Switch */}
                <select
                  value={language}
                  onChange={(e) => setLanguage(e.target.value)}
                  className="bg-slate-800 text-amber-200 border border-slate-700 px-2.5 py-1 rounded-lg text-xs font-semibold focus:outline-none cursor-pointer"
                >
                  <option value="ko">한국어 (KO)</option>
                  <option value="en">English (EN)</option>
                  <option value="ja">日本語 (JA)</option>
                  <option value="zh">中文 (ZH)</option>
                </select>

              </div>

            </div>
          </header>

          {/* Filter Bar */}
          <div className="bg-white border-b border-slate-200 py-3 px-4 sticky top-14 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 text-xs">
              
              <input
                type="text"
                value={filters.searchQuery}
                onChange={(e) => setFilters({ ...filters, searchQuery: e.target.value })}
                placeholder={t.searchPlaceholder}
                className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs w-64 focus:outline-none focus:ring-2 focus:ring-amber-500"
              />

              <div className="flex items-center space-x-3">
                <button
                  onClick={() => setFilters({ ...filters, mustSeeOnly: !filters.mustSeeOnly })}
                  className={`px-3 py-1.5 rounded-lg border font-bold ${
                    filters.mustSeeOnly
                      ? 'bg-amber-500 text-white border-amber-600 shadow'
                      : 'bg-slate-50 text-slate-700 border-slate-200'
                  }`}
                >
                  ✨ {t.filterMustSeeOnly}
                </button>

                <div className="flex items-center space-x-2 bg-slate-50 px-3 py-1 rounded-lg border border-slate-200">
                  <span className="text-slate-500">{t.minAuthenticity}:</span>
                  <span className="font-bold text-amber-600">{filters.minAuthenticityScore.toFixed(1)}⭐</span>
                  <input
                    type="range"
                    min="1.0"
                    max="4.8"
                    step="0.2"
                    value={filters.minAuthenticityScore}
                    onChange={(e) => setFilters({ ...filters, minAuthenticityScore: parseFloat(e.target.value) })}
                    className="w-20 accent-amber-600"
                  />
                </div>
              </div>

            </div>
          </div>

          {/* Main Content Area */}
          <main className="flex-1 relative">
            {viewMode === 'map' ? (
              <div className="relative w-full h-[calc(100vh-7.5rem)]">
                <div ref={mapContainerRef} className="w-full h-full" />
                
                {/* Map Notice Banner */}
                <div className="absolute top-4 left-4 z-10 bg-slate-900/90 text-amber-200 px-3 py-1.5 rounded-lg text-xs border border-amber-500/30">
                  {t.mapNotice}
                </div>
              </div>
            ) : (
              <div className="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredPlaces.map((place) => (
                  <div
                    key={place.id}
                    onClick={() => { setSelectedPlace(place); setViewMode('map'); }}
                    className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-lg transition-all cursor-pointer"
                  >
                    <img src={place.image} className="h-44 w-full object-cover" />
                    <div className="p-4 space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-amber-600">{place.authenticityScore.toFixed(2)}⭐</span>
                        <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold uppercase">
                          {place.grade}
                        </span>
                      </div>
                      <h3 className="font-serif font-bold text-base text-slate-900">{place.name[language]}</h3>
                      <p className="text-xs text-slate-600 line-clamp-2">{place.docentSummary[language]}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Place Quick View Docent Bottom Sheet */}
          {selectedPlace && viewMode === 'map' && (
            <div className="fixed bottom-0 inset-x-0 z-50 p-4 max-w-3xl mx-auto">
              <div className="bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl border border-slate-200 overflow-hidden max-h-[80vh] overflow-y-auto">
                
                {/* Image & Header */}
                <div className="relative h-44 bg-slate-900">
                  <img src={selectedPlace.image} className="w-full h-full object-cover" />
                  <button
                    onClick={() => setSelectedPlace(null)}
                    className="absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-900/80 text-white flex items-center justify-center font-bold text-sm"
                  >
                    ✕
                  </button>
                  <div className="absolute bottom-3 left-4 text-white">
                    <h2 className="font-serif font-bold text-xl drop-shadow">{selectedPlace.name[language]}</h2>
                    <p className="text-xs text-amber-200">{selectedPlace.address[language]}</p>
                  </div>
                </div>

                {/* Body Details */}
                <div className="p-5 space-y-4">
                  
                  {/* Rating Breakdown */}
                  <div className="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-xl border text-xs text-center">
                    <div>
                      <div className="text-slate-500">{t.authenticityScore}</div>
                      <div className="font-bold text-amber-600 text-base">{selectedPlace.authenticityScore.toFixed(2)}⭐</div>
                    </div>
                    <div>
                      <div className="text-slate-500">{t.culturalValue}</div>
                      <div className="font-bold text-teal-600 text-base">{selectedPlace.culturalValueScore.toFixed(2)}⭐</div>
                    </div>
                    <div>
                      <div className="text-slate-500">{t.commercialityRatio}</div>
                      <div className="font-bold text-rose-600 text-base">{selectedPlace.commercialityRatio}%</div>
                    </div>
                  </div>

                  {/* Audio Docent Player Box */}
                  <div className="bg-heritage-navy text-white p-4 rounded-xl space-y-2">
                    <div className="flex items-center justify-between">
                      <h4 className="font-serif font-bold text-xs text-amber-200">✨ {t.docentGuideTitle}</h4>
                      <button
                        onClick={() => setIsPlayingAudio(!isPlayingAudio)}
                        className={`px-3 py-1 rounded-full text-xs font-bold ${isPlayingAudio ? 'bg-rose-600' : 'bg-amber-500 text-white'}`}
                      >
                        {isPlayingAudio ? t.stopDocent : t.listenDocent}
                      </button>
                    </div>

                    {isPlayingAudio && (
                      <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                        <div className="bg-amber-400 h-full transition-all duration-200" style={{ width: `${audioProgress}%` }} />
                      </div>
                    )}

                    <p className="text-xs italic text-amber-100 font-serif border-l-2 border-amber-400 pl-2">
                      "{selectedPlace.docentAudioScript[language]}"
                    </p>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      {selectedPlace.docentSummary[language]}
                    </p>
                  </div>

                  {/* Tags */}
                  <div className="flex flex-wrap gap-1.5">
                    {selectedPlace.positiveTags.map((tag, i) => (
                      <span key={i} className="text-[11px] bg-amber-50 text-amber-800 border border-amber-200 px-2 py-0.5 rounded-full font-medium">
                        {tag}
                      </span>
                    ))}
                    {selectedPlace.commercialWarningTags?.map((tag, i) => (
                      <span key={i} className="text-[11px] bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-full font-medium">
                        ⚠️ {tag}
                      </span>
                    ))}
                  </div>

                  {/* Write Review Button */}
                  <div className="pt-2 flex justify-end">
                    <button
                      onClick={() => setReviewingPlace(selectedPlace)}
                      className="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-4 py-2 rounded-lg shadow"
                    >
                      ✍️ {t.writeReviewBtn}
                    </button>
                  </div>

                </div>

              </div>
            </div>
          )}

          {/* Review Modal */}
          {reviewingPlace && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-serif font-bold text-base text-slate-900">{t.reviewModalTitle}</h3>
                  <button onClick={() => setReviewingPlace(null)} className="text-slate-400 font-bold">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  handleReviewSubmit(reviewingPlace.id, {
                    id: 'r-' + Date.now(),
                    user: 'Visitor Evaluator',
                    date: new Date().toISOString().split('T')[0],
                    authenticityRating: 4.8,
                    culturalValueRating: 4.9,
                    commercialityRating: 1.2,
                    comment: 'Authentic heritage site verified by GPS.',
                    tags: ['#NationalHeritage'],
                    verifiedVisit: true,
                    language
                  });
                  setReviewingPlace(null);
                }} className="space-y-3 text-xs">
                  <p className="text-slate-600">{t.reviewModalDesc}</p>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">{t.ratingAuthenticity}</label>
                    <input type="range" min="1.0" max="5.0" step="0.1" defaultValue="4.8" className="w-full accent-amber-600" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">{t.reviewComment}</label>
                    <textarea rows="3" required placeholder={t.reviewCommentPlaceholder} className="w-full p-2 border rounded" />
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setReviewingPlace(null)} className="px-3 py-1.5 text-slate-600">
                      {t.cancel}
                    </button>
                    <button type="submit" className="px-4 py-1.5 bg-amber-600 text-white font-bold rounded shadow">
                      {t.submitReview}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
